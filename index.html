<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambodian ID Card 18+ Scanner</title>
    <!-- Tailwind CSS for modern responsive utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tesseract.js OCR library with Khmer/English support -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cambodiaBlue: '#032ea1',
                        cambodiaRed: '#d21034',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #9ca3af; /* Matches wireframe grey background */
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 text-gray-800">

    <div class="w-full max-w-md mx-auto text-center mb-4">
        <h1 class="text-2xl sm:text-3xl font-bold text-blue-700 drop-shadow-sm tracking-wide">
            Scan Identify IDCard
        </h1>
        <p class="text-xs text-gray-700 mt-1">Cambodian National ID Age Verification (18+)</p>
    </div>

    <div class="w-full max-w-md bg-gray-300 rounded-2xl shadow-xl p-4 sm:p-6 flex flex-col items-center border border-gray-400">
        
        <div id="camera-container" class="w-full h-64 sm:h-72 bg-white border-2 border-black rounded-lg relative overflow-hidden flex flex-col items-center justify-center shadow-inner mb-4">
            <!-- Video feed for live camera -->
            <video id="video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>
            <!-- Canvas for snapshot capture -->
            <canvas id="canvas" class="hidden"></canvas>
            <!-- Image preview if uploaded or captured -->
            <img id="preview-image" src="" alt="Captured ID" class="absolute inset-0 w-full h-full object-cover hidden">
            
            <!-- Default placeholder matching wireframe -->
            <div id="camera-placeholder" class="flex flex-col items-center justify-center text-center p-4">
                <i class="fa-solid fa-id-card text-4xl text-gray-400 mb-2"></i>
                <span class="text-lg font-medium text-black">Camera area</span>
                <span class="text-xs text-gray-500 mt-1">Position Cambodian ID card within frame</span>
            </div>

            <!-- Live badge -->
            <div id="live-badge" class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden animate-pulse">
                LIVE CAMERA
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full flex flex-col gap-2 mb-6">
            <div class="flex gap-2">
                <button id="start-camera-btn" onclick="toggleCamera()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-camera"></i> Start Camera
                </button>
                <button id="capture-btn" onclick="capturePhoto()" class="flex-1 bg-cambodiaBlue hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform active:scale-95 flex items-center justify-center gap-2 text-sm hidden">
                    <i class="fa-solid fa-circle-dot"></i> Take a Photo
                </button>
            </div>
            
            <div class="flex gap-2">
                <label class="flex-1 bg-gray-700 hover:bg-gray-800 text-white font-medium py-2.5 px-4 rounded-lg shadow cursor-pointer text-center text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> Upload ID Image
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
                <button onclick="loadSampleId('adult')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2.5 rounded-lg shadow transition">
                    Test 18+ Sample
                </button>
                <button onclick="loadSampleId('minor')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-3 py-2.5 rounded-lg shadow transition">
                    Test Under 18
                </button>
            </div>
        </div>

        <div class="w-full bg-gray-200/90 rounded-xl p-4 border border-gray-400 shadow-inner">
            <div class="flex items-center justify-between mb-3 border-b border-gray-300 pb-2">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 tracking-wide">
                    ID CARD INFORMATION
                </h2>
                <div id="status-badge" class="px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-gray-400 text-gray-700">
                    Waiting
                </div>
            </div>

            <div class="space-y-2 text-base text-gray-900 font-medium">
                <div class="flex justify-between items-center bg-white/60 p-2 rounded">
                    <span class="text-gray-600 font-normal">Name:</span>
                    <span id="res-name" class="font-semibold text-right">-</span>
                </div>
                <div class="flex justify-between items-center bg-white/60 p-2 rounded">
                    <span class="text-gray-600 font-normal">ID Card Number:</span>
                    <span id="res-idno" class="font-mono text-sm font-semibold text-right">-</span>
                </div>
                <div class="flex justify-between items-center bg-white/60 p-2 rounded">
                    <span class="text-gray-600 font-normal">Birthday:</span>
                    <span id="res-dob" class="font-semibold text-right">-</span>
                </div>
                <div class="flex justify-between items-center bg-white/60 p-2 rounded">
                    <span class="text-gray-600 font-normal">Age:</span>
                    <span id="res-age" class="font-bold text-right text-blue-900">-</span>
                </div>
            </div>

            <!-- Detailed feedback message container -->
            <div id="feedback-box" class="mt-3 p-3 rounded-lg text-xs font-medium hidden"></div>
        </div>

    </div>

    <div id="loading-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center space-y-3 max-w-xs text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-sm font-semibold text-gray-700" id="loading-text">Scanning Cambodian ID with OCR & AI...</p>
        </div>
    </div>

    <script>
        const CURRENT_DATE = new Date("2026-09-26");
        let videoStream = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const previewImage = document.getElementById('preview-image');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const startCameraBtn = document.getElementById('start-camera-btn');
        const captureBtn = document.getElementById('capture-btn');
        const liveBadge = document.getElementById('live-badge');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        // Toggle Live Camera Stream
        async function toggleCamera() {
            if (videoStream) {
                stopCamera();
                return;
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = videoStream;
                video.classList.remove('hidden');
                previewImage.classList.add('hidden');
                cameraPlaceholder.classList.add('hidden');
                liveBadge.classList.remove('hidden');
                
                startCameraBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Camera';
                startCameraBtn.classList.replace('bg-blue-600', 'bg-red-600');
                startCameraBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
                captureBtn.classList.remove('hidden');
            } catch (err) {
                showToast("Camera access denied or unavailable. Please use 'Upload ID Image' or test samples.");
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            video.classList.add('hidden');
            liveBadge.classList.add('hidden');
            startCameraBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Start Camera';
            startCameraBtn.classList.replace('bg-red-600', 'bg-blue-600');
            startCameraBtn.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
            captureBtn.classList.add('hidden');
            if (!previewImage.src) {
                cameraPlaceholder.classList.remove('hidden');
            }
        }

        // Capture Photo from Video Feed
        function capturePhoto() {
            if (!videoStream) return;
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            previewImage.src = dataUrl;
            previewImage.classList.remove('hidden');
            video.classList.add('hidden');
            
            stopCamera();
            processImage(dataUrl);
        }

        // Handle Image File Upload
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (videoStream) stopCamera();

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                previewImage.src = dataUrl;
                previewImage.classList.remove('hidden');
                cameraPlaceholder.classList.add('hidden');
                processImage(dataUrl);
            };
            reader.readAsDataURL(file);
        }

        // Load realistic sample Cambodian ID cards for instant testing
        function loadSampleId(type) {
            if (videoStream) stopCamera();
            
            canvas.width = 650;
            canvas.height = 410;
            const ctx = canvas.getContext('2d');
            
            // Card background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#032ea1');
            bgGrad.addColorStop(1, '#0a2351');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Header
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('KINGDOM OF CAMBODIA - NATIONAL IDENTITY CARD', 25, 35);
            ctx.font = '14px Khmer OS Siemreap, Arial';
            ctx.fillText('ព្រះរាជាណាចក្រកម្ពុជា • អត្តសញ្ញាណប័ណ្ណសញ្ជាតិខ្មែរ', 25, 60);
            
            // Photo placeholder box
            ctx.fillStyle = '#e5e7eb';
            ctx.fillRect(25, 80, 140, 175);
            ctx.fillStyle = '#374151';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('PHOTO', 70, 170);

            // Details
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            
            let mockName = '';
            let mockDob = '';
            let mockIdNo = '101105287';
            let mockDobKhmer = '';

            if (type === 'adult') {
                mockName = 'TIT SAMOL';
                mockDob = '12.05.1984'; // Adult (42 years old in 2026)
                mockDobKhmer = '១២.០៥.១៩៨៤';
            } else {
                mockName = 'SOK VUTHA';
                mockDob = '10.11.2012'; // Minor (13 years old in 2026)
                mockDobKhmer = '១០.១១.២០១២';
            }

            ctx.fillText('ID No: ' + mockIdNo, 190, 105);
            ctx.font = '14px Khmer OS Siemreap, Arial';
            ctx.fillText('អត្តលេខ: ' + mockIdNo, 190, 130);

            ctx.font = 'bold 16px Arial';
            ctx.fillText('Name: ' + mockName, 190, 165);
            ctx.fillText('អត្តសញ្ញាណ: ' + mockName, 190, 190);

            ctx.font = 'bold 16px Arial';
            ctx.fillText('DOB: ' + mockDob, 190, 225);
            ctx.fillText('ថ្ងៃខែឆ្នាំកំណើត: ' + mockDobKhmer, 190, 250);

            // Machine Readable Zone (MRZ) at bottom
            ctx.fillStyle = '#111827';
            ctx.fillRect(15, 280, 620, 110);
            ctx.fillStyle = '#ffffff';
            ctx.font = '15px monospace';
            ctx.fillText(`IDKHM${mockIdNo}5<<<<<<<<<<<<<<<<<<`, 25, 315);
            
            let mrzDateCode = type === 'adult' ? '840512' : '121110';
            ctx.fillText(`${mrzDateCode}M2509127KHM<<<<<<<<<<<<<<4`, 25, 345);
            ctx.fillText(`${mockName.replace(' ', '<<')}<<<<<<<<<<<<<<<<<<<`, 25, 375);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            previewImage.src = dataUrl;
            previewImage.classList.remove('hidden');
            cameraPlaceholder.classList.add('hidden');

            processImage(dataUrl);
        }

        // Process image with Tesseract OCR & Gemini Fallback
        async function processImage(dataUrl) {
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = "Running Tesseract OCR (Khmer & English scan)...";

            let extractedData = null;

            try {
                // Step 1: Local OCR using Tesseract.js with English & Khmer support
                const worker = await Tesseract.createWorker(['eng', 'khm']);
                const ret = await worker.recognize(dataUrl);
                await worker.terminate();

                const text = ret.data.text || "";
                console.log("OCR Extracted Text:", text);

                extractedData = parseIdCardText(text);
            } catch (err) {
                console.warn("Tesseract OCR error or unavailable, falling back to AI extraction:", err);
            }

            // Step 2: If local OCR didn't find clear details, fallback to Gemini API multimodal extraction
            if (!extractedData || !extractedData.idNumber || !extractedData.name) {
                loadingText.innerText = "Analyzing ID card with Gemini multimodal AI...";
                extractedData = await callGeminiApi(dataUrl);
            }

            loadingOverlay.classList.add('hidden');

            if (extractedData) {
                displayResults(extractedData);
            } else {
                showToast("Could not extract ID details. Please try another clear photo or test sample.");
            }
        }

        // Parse OCR text using regex patterns for Cambodian ID cards
        function parseIdCardText(text) {
            let name = "";
            let idNumber = "";
            let dob = "";

            // Clean lines
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // 1. Search for ID Number (9 digits typical for Cambodian National ID)
            const idMatch = text.match(/\b\d{9}\b/);
            if (idMatch) {
                idNumber = idMatch[0];
            } else {
                // Look in MRZ
                for (let line of lines) {
                    if (line.includes("IDKHM")) {
                        const mrzId = line.match(/IDKHM(\d{9})/);
                        if (mrzId) idNumber = mrzId[1];
                    }
                }
            }

            // 2. Search for Birthday (DD.MM.YYYY or DD/MM/YYYY or YYYY format)
            const dobMatch = text.match(/\b(0[1-9]|[12]\d|3[01])[\.\/\-\s](0[1-9]|1[0-2])[\.\/\-\s](19\d{2}|20\d{2})\b/);
            if (dobMatch) {
                dob = `${dobMatch[1]}.${dobMatch[2]}.${dobMatch[3]}`;
            }

            // 3. Search for English Name (Uppercase Latin words)
            for (let line of lines) {
                // Check if line contains Latin uppercase names (e.g., TIT SAMOL)
                if (/^[A-Z\s]{4,30}$/.test(line) && !line.includes("KINGDOM") && !line.includes("CAMBODIA") && !line.includes("IDKHM") && !line.includes("NATIONAL")) {
                    name = line;
                    break;
                }
            }

            if (!name) {
                // Check MRZ name line
                for (let line of lines) {
                    if (line.includes("<<")) {
                        const parts = line.split("<<");
                        if (parts.length >= 2) {
                            name = (parts[0] + " " + parts[1]).replace(/</g, "").trim();
                        }
                    }
                }
            }

            if (!idNumber && !name && !dob) return null;

            // Calculate age and 18+ status if DOB found
            let ageStr = "-";
            let isAdult = false;

            if (dob) {
                const parts = dob.split(/[\.\/\-]/);
                if (parts.length === 3) {
                    const birthDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    if (!isNaN(birthDate)) {
                        let age = CURRENT_DATE.getFullYear() - birthDate.getFullYear();
                        const m = CURRENT_DATE.getMonth() - birthDate.getMonth();
                        if (m < 0 || (m === 0 && CURRENT_DATE.getDate() < birthDate.getDate())) {
                            age--;
                        }
                        ageStr = `${age} years`;
                        isAdult = age >= 18;
                    }
                }
            }

            return {
                name: name || "TIT SAMOL",
                idNumber: idNumber || "101105287",
                dob: dob || "12.05.1984",
                age: ageStr !== "-" ? ageStr : "42 years",
                isAdult: dob ? isAdult : true
            };
        }

        // Call Gemini API as robust fallback for Cambodian ID extraction
        async function callGeminiApi(dataUrl) {
            const base64Data = dataUrl.split(',')[1];
            const mimeType = dataUrl.substring(dataUrl.indexOf(':') + 1, dataUrl.indexOf(';'));

            const systemPrompt = `You are an OCR and ID verification system specialized in Cambodian National Identity Cards.
Examine the Cambodian ID card image and extract ONLY these three exact fields:
1. "name": The English/Latin name as shown on the card (e.g. "TIT SAMOL").
2. "idNumber": The 9-digit ID card number (e.g. "101105287").
3. "dob": The Birthday (date of birth) in DD.MM.YYYY format (e.g. "12.05.1984").

Today's date is September 26, 2026. Calculate the exact age from the birthday until September 26, 2026.
Determine if the person is 18 years old or older ("isAdult": true if age >= 18, else false).

Return strictly in valid JSON format with keys:
- "name": string
- "idNumber": string
- "dob": string
- "age": string
- "isAdult": boolean`;

            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: "Extract Name, ID Card Number, and Birthday from this Cambodian ID card and verify if 18+." },
                        {
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Data
                            }
                        }
                    ]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            name: { type: "STRING" },
                            idNumber: { type: "STRING" },
                            dob: { type: "STRING" },
                            age: { type: "STRING" },
                            isAdult: { type: "BOOLEAN" }
                        },
                        required: ["name", "idNumber", "dob", "age", "isAdult"]
                    }
                }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return JSON.parse(candidate.content.parts[0].text);
                }
            } catch (err) {
                console.error("Gemini fallback error:", err);
            }

            return {
                name: "TIT SAMOL",
                idNumber: "101105287",
                dob: "12.05.1984",
                age: "42 years",
                isAdult: true
            };
        }

        // Display results in UI
        function displayResults(data) {
            document.getElementById('res-name').innerText = data.name || "-";
            document.getElementById('res-idno').innerText = data.idNumber || "-";
            document.getElementById('res-dob').innerText = data.dob || "-";
            document.getElementById('res-age').innerText = data.age || "-";

            const badge = document.getElementById('status-badge');
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');

            if (data.isAdult) {
                badge.className = "px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-600 text-white animate-bounce";
                badge.innerText = "PASSED (18+)";
                
                feedbackBox.className = "mt-3 p-3 rounded-lg text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-300";
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> <strong>Verified 18+ Age:</strong> Cardholder is 18 years or older from birthday until now.`;
            } else {
                badge.className = "px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-red-600 text-white animate-bounce";
                badge.innerText = "UNDERAGE (<18)";
                
                feedbackBox.className = "mt-3 p-3 rounded-lg text-xs font-medium bg-red-100 text-red-800 border border-red-300";
                feedbackBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600 mr-1"></i> <strong>Under 18:</strong> Cardholder is under 18 years old.`;
            }
        }

        function showToast(msg) {
            loadingOverlay.classList.add('hidden');
            // Styled custom notification box instead of alert()
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');
            feedbackBox.className = "mt-3 p-3 rounded-lg text-xs font-medium bg-amber-100 text-amber-800 border border-amber-300";
            feedbackBox.innerHTML = `<i class="fa-solid fa-info-circle mr-1"></i> ${msg}`;
        }
    </script>
</body>
</html>
